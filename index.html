<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Murmuration</title>
<style>
  :root { --ink: #f2ebdd; --ink-dim: rgba(242, 235, 221, 0.5); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #0b0e1c; }
  #sky { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }

  .overlay {
    position: fixed; z-index: 2; color: var(--ink);
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
    user-select: none; pointer-events: none;
    transition: opacity 1.8s ease;
    text-shadow: 0 1px 22px rgba(0,0,0,0.55);
  }
  .title { left: clamp(20px, 4vw, 56px); bottom: clamp(20px, 4vh, 48px); }
  .title h1 {
    font-family: ui-serif, Georgia, "Times New Roman", serif;
    font-weight: 300; font-size: clamp(1.9rem, 5.2vw, 3.6rem);
    letter-spacing: 0.12em; line-height: 1;
  }
  .title p {
    margin-top: 0.7em; font-size: 0.72rem; letter-spacing: 0.3em;
    text-transform: uppercase; color: var(--ink-dim);
  }
  .hint {
    right: clamp(20px, 4vw, 56px); bottom: clamp(20px, 4vh, 48px);
    text-align: right; font-size: 0.72rem; letter-spacing: 0.13em;
    color: var(--ink-dim); line-height: 2.05;
  }
  .hint b { color: var(--ink); font-weight: 500; }
  .hint kbd {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 0.68rem; color: var(--ink);
    border: 1px solid rgba(242,235,221,0.3); border-radius: 4px;
    padding: 1px 5px; letter-spacing: 0;
  }
  .hud {
    left: 50%; top: clamp(16px, 3.4vh, 36px); transform: translateX(-50%);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 0.66rem; letter-spacing: 0.32em; color: var(--ink-dim);
    text-transform: uppercase; white-space: nowrap;
  }
  .hud b { color: var(--ink); font-weight: 400; }
  .sound {
    position: fixed; z-index: 3; top: clamp(14px, 3vh, 32px); right: clamp(18px, 4vw, 52px);
    pointer-events: auto; cursor: pointer;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 0.64rem; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--ink-dim); background: rgba(20,22,40,0.28);
    border: 1px solid rgba(242,235,221,0.22); border-radius: 999px;
    padding: 6px 13px; backdrop-filter: blur(6px);
    transition: color .3s ease, border-color .3s ease, background .3s ease;
    text-shadow: 0 1px 14px rgba(0,0,0,0.5);
  }
  .sound:hover { color: var(--ink); border-color: rgba(242,235,221,0.5); }
  .sound.on { color: var(--ink); border-color: rgba(242,235,221,0.55); background: rgba(40,44,70,0.4); }
  .sound:focus-visible { outline: 2px solid rgba(242,235,221,0.7); outline-offset: 3px; }
  .faded { opacity: 0; }
  .nogl {
    position: fixed; inset: 0; z-index: 5; display: none;
    align-items: center; justify-content: center; text-align: center;
    color: var(--ink); font-family: ui-sans-serif, sans-serif; padding: 2rem;
  }
  @media (prefers-reduced-motion: reduce) { .overlay { transition: none; } }
  @media (max-width: 640px) { .hint { display: none; } }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<button class="sound" id="soundBtn" aria-pressed="false">♪ sound off</button>
<div class="overlay hud" id="hudEl"></div>
<div class="overlay title" id="titleEl">
  <h1>Murmuration</h1>
  <p>a living sky</p>
</div>
<div class="overlay hint" id="hintEl">
  move &mdash; the flock reads you as a <b>falcon</b><br>
  drag the water &mdash; make waves<br>
  click &mdash; scatter the sky<br>
  <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> <kbd>4</kbd> &mdash; gather into a shape<br>
  <kbd>space</kbd> &mdash; release the flock
</div>
<div class="nogl" id="noglEl"><p>This piece needs WebGL2.<br>Please try a current browser.</p></div>

<script>
(() => {
  "use strict";
  const canvas = document.getElementById("sky");
  const gl = canvas.getContext("webgl2", { alpha: false, antialias: true });
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!gl) { document.getElementById("noglEl").style.display = "flex"; return; }
  const floatExt = gl.getExtension("EXT_color_buffer_float") || gl.getExtension("EXT_color_buffer_half_float");

  let W = 0, H = 0, DPR = 1, waterY = 0;

  // ---------- Day/night palette (CPU side; mirrored to shaders as uniforms) ----------
  const K = {
    NIGHT:    { c: [[8,10,24],[12,14,32],[20,20,44],[30,26,54],[44,34,60],[60,44,66]], s: 1.0 },
    DAWN:     { c: [[26,30,66],[70,58,104],[150,96,120],[224,140,130],[244,180,150],[252,214,180]], s: 0.28 },
    DAY:      { c: [[40,92,172],[74,132,206],[120,170,224],[176,206,236],[212,230,244],[236,244,250]], s: 0.0 },
    GOLDEN:   { c: [[38,44,92],[92,80,120],[190,120,96],[236,158,92],[248,192,120],[252,222,164]], s: 0.05 },
    DUSK:     { c: [[16,20,40],[34,32,62],[110,72,84],[176,96,74],[222,140,84],[248,206,150]], s: 0.22 },
    TWILIGHT: { c: [[10,12,30],[22,22,48],[52,40,72],[96,58,78],[140,80,84],[180,110,96]], s: 0.7 },
  };
  const SCHED = [ [0.00,"NIGHT"], [0.15,"DAWN"], [0.32,"DAY"], [0.55,"GOLDEN"], [0.70,"DUSK"], [0.85,"TWILIGHT"], [1.00,"NIGHT"] ];
  const stopsFlat = new Float32Array(18);
  let curStar = 0;
  function computeSky(c) {
    c = ((c % 1) + 1) % 1;
    let a = SCHED[0], b = SCHED[1];
    for (let i = 1; i < SCHED.length; i++) { if (c <= SCHED[i][0]) { a = SCHED[i-1]; b = SCHED[i]; break; } }
    const f = (c - a[0]) / (b[0] - a[0]);
    const A = K[a[1]], B = K[b[1]];
    for (let i = 0; i < 6; i++) for (let k = 0; k < 3; k++)
      stopsFlat[i*3+k] = A.c[i][k] + (B.c[i][k] - A.c[i][k]) * f;
    curStar = A.s + (B.s - A.s) * f;
  }
  const SP = [0, 0.40, 0.62, 0.80, 0.92, 1.0];
  function sampleSky(t) {
    t = t < 0 ? 0 : t > 1 ? 1 : t;
    for (let i = 1; i < 6; i++) {
      if (t <= SP[i]) {
        const f = (t - SP[i-1]) / (SP[i] - SP[i-1]);
        return [stopsFlat[(i-1)*3]+(stopsFlat[i*3]-stopsFlat[(i-1)*3])*f,
                stopsFlat[(i-1)*3+1]+(stopsFlat[i*3+1]-stopsFlat[(i-1)*3+1])*f,
                stopsFlat[(i-1)*3+2]+(stopsFlat[i*3+2]-stopsFlat[(i-1)*3+2])*f];
      }
    }
    return [stopsFlat[15], stopsFlat[16], stopsFlat[17]];
  }

  // ---------- GL helpers ----------
  function mkShader(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
      console.error("shader error:", gl.getShaderInfoLog(s), "\n--- source ---\n" + src);
    return s;
  }
  function mkProg(vs, fs) {
    const p = gl.createProgram();
    gl.attachShader(p, mkShader(gl.VERTEX_SHADER, vs));
    gl.attachShader(p, mkShader(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) console.error("link error:", gl.getProgramInfoLog(p));
    return p;
  }
  const U = (p, n) => gl.getUniformLocation(p, n);

  const SKY_FN = `
  uniform vec3 uStops[6];
  const float SPP[6] = float[6](0.0,0.40,0.62,0.80,0.92,1.0);
  vec3 skyCol(float t){
    t = clamp(t, 0.0, 1.0);
    vec3 c = uStops[5];
    for (int i = 1; i < 6; i++) {
      if (t <= SPP[i]) { c = mix(uStops[i-1], uStops[i], (t-SPP[i-1])/(SPP[i]-SPP[i-1])); break; }
    }
    return c / 255.0;
  }
  float hash21(vec2 p){ p = fract(p*vec2(123.34,456.21)); p += dot(p, p+45.32); return fract(p.x*p.y); }
  `;

  const QUAD_VS = `#version 300 es
  layout(location=0) in vec2 aPos;
  out vec2 vUV;
  void main(){ vUV = aPos; gl_Position = vec4(aPos*2.0-1.0, 0.0, 1.0); }`;

  // ---------- Sky shader (gradient + stars + sun/moon with halo) ----------
  const SKY_FS = `#version 300 es
  precision highp float;
  in vec2 vUV; out vec4 outC;
  uniform vec2 uRes; uniform float uTime, uStar, uWaterY;
  uniform vec3 uBodyCol; uniform vec4 uBody; // x,y,r,alt
  uniform float uIsSun;
  ${SKY_FN}
  void main(){
    float yPix = (1.0 - vUV.y) * uRes.y;         // screen y (down)
    float xPix = vUV.x * uRes.x;
    float t = yPix / uRes.y;
    vec3 col = skyCol(t);
    // stars
    if (uStar > 0.01 && yPix < uWaterY*0.92) {
      vec2 cell = floor(vec2(xPix, yPix)/26.0);
      float h = hash21(cell);
      if (h > 0.90) {
        vec2 sp = vec2(hash21(cell+7.1), hash21(cell+3.7))*26.0 + cell*26.0;
        float d = length(vec2(xPix,yPix)-sp);
        float tw = 0.6 + 0.4*sin(uTime*(1.0+h*2.0)*2.0 + h*40.0);
        float fade = 1.0 - yPix/(uWaterY*0.92);
        col += vec3(1.0,0.98,0.93) * smoothstep(1.6,0.2,d) * uStar * tw * fade * (0.35+0.65*h);
      }
    }
    // sun / moon
    if (uBody.w > -0.05) {
      float d = distance(vec2(xPix,yPix), uBody.xy);
      float halo = exp(-d / (min(uRes.x,uRes.y)*0.30)) * 0.30 * max(0.15, uBody.w);
      col += uBodyCol * halo;
      float disc = smoothstep(uBody.z+1.5, uBody.z-1.5, d);
      vec3 body = uBodyCol;
      if (uIsSun < 0.5) {  // crescent shading
        float d2 = distance(vec2(xPix,yPix), uBody.xy + vec2(uBody.z*0.42, -uBody.z*0.28));
        float sh = smoothstep(uBody.z*0.92+1.5, uBody.z*0.92-1.5, d2);
        body = mix(body, skyCol(uBody.y/uRes.y), sh*0.85);
      }
      col = mix(col, body, disc);
    }
    outC = vec4(col, 1.0);
  }`;

  // ---------- Bird shader (instanced, flat-shaded 3D, flap + bank, plastic specular) ----------
  const BIRD_VS = `#version 300 es
  layout(location=0) in vec3 aPos;
  layout(location=1) in vec3 aNorm;
  layout(location=2) in float aWing;    // signed flap weight
  layout(location=3) in vec4 aI0;       // x, y, depth z (0 far..1 near), heading
  layout(location=4) in vec3 aI1;       // bank, flapPhase, size(px)
  uniform vec2 uRes; uniform float uReflect, uWaterY, uSquash;
  out vec3 vN; out vec2 vScr; out float vZ;
  void main(){
    float flap = sin(aI1.y) * 0.85;
    vec3 p = aPos, n = aNorm;
    float a = flap * aWing;              // wings
    float ca = cos(a), sa = sin(a);
    p.yz = mat2(ca,-sa,sa,ca) * p.yz;  n.yz = mat2(ca,-sa,sa,ca) * n.yz;
    float b = aI1.x;                     // bank
    float cb = cos(b), sb = sin(b);
    p.yz = mat2(cb,-sb,sb,cb) * p.yz;  n.yz = mat2(cb,-sb,sb,cb) * n.yz;
    float th = aI0.w;                    // heading (screen space, y down)
    float ch = cos(th), sh = sin(th);
    p.xy = mat2(ch,-sh,sh,ch) * p.xy;  n.xy = mat2(ch,-sh,sh,ch) * n.xy;
    vec2 xy = aI0.xy + p.xy * aI1.z;
    if (uReflect > 0.5) xy.y = uWaterY + (uWaterY - xy.y) * uSquash;
    vec2 ndc = vec2(xy.x/uRes.x*2.0-1.0, 1.0 - xy.y/uRes.y*2.0);
    gl_Position = vec4(ndc, mix(0.8, -0.8, aI0.z), 1.0);
    vN = n; vScr = xy; vZ = aI0.z;
  }`;

  const BIRD_FS = `#version 300 es
  precision highp float;
  in vec3 vN; in vec2 vScr; in float vZ; out vec4 outC;
  uniform vec2 uRes; uniform vec3 uLightPos, uLightCol; uniform float uLightI, uReflect;
  ${SKY_FN}
  void main(){
    vec3 n = normalize(vN);
    if (!gl_FrontFacing) n = -n;
    vec3 L = normalize(vec3(uLightPos.xy - vScr, uLightPos.z));
    vec3 V = vec3(0.0, 0.0, 1.0);
    vec3 Hv = normalize(L + V);
    vec3 behind = skyCol(vScr.y / uRes.y);
    float lum = dot(behind, vec3(0.2126, 0.7152, 0.0722));
    float tt = smoothstep(0.06, 0.34, lum);
    vec3 alb = mix(vec3(0.95, 0.92, 0.86), vec3(0.09, 0.08, 0.12), tt);  // pale in dark sky, dark vs bright sky
    float diff = max(dot(n, L), 0.0);
    float spec = pow(max(dot(n, Hv), 0.0), 42.0) * 1.15;
    vec3 irid = mix(vec3(0.55, 0.95, 0.80), vec3(0.90, 0.65, 1.05), clamp(0.5 + 0.7*n.x, 0.0, 1.0));
    vec3 amb = mix(behind, vec3(0.5 + lum), 0.55) * 0.85 + 0.10;
    vec3 col = alb * (amb + uLightCol * diff * uLightI * 0.8) + irid * spec * uLightI;
    col = mix(col, behind, (1.0 - vZ) * 0.30);      // atmospheric haze on far birds
    float alpha = mix(0.7, 1.0, vZ);
    if (uReflect > 0.5) { col *= vec3(0.50, 0.58, 0.74); alpha *= 0.55; }
    outC = vec4(col, alpha);
  }`;

  // ---------- Shadow shader (soft blobs on the water) ----------
  const SHADOW_VS = `#version 300 es
  layout(location=0) in vec2 aPos;      // unit quad 0..1
  layout(location=3) in vec4 aI0;
  layout(location=4) in vec3 aI1;
  uniform vec2 uRes; uniform float uWaterY, uSquash; uniform vec3 uLightPos;
  out vec2 vQ; out float vA;
  void main(){
    float alt = clamp((uWaterY - aI0.y) / (uWaterY*0.55), 0.0, 1.0);
    float sy = uWaterY + (uWaterY - aI0.y) * uSquash;
    float sx = aI0.x + (aI0.x - uLightPos.x) * 0.05 * (1.0 - alt);
    float w = aI1.z * 4.2, h = aI1.z * 1.3;
    vec2 xy = vec2(sx, sy) + (aPos - 0.5) * vec2(w, h);
    vec2 ndc = vec2(xy.x/uRes.x*2.0-1.0, 1.0 - xy.y/uRes.y*2.0);
    gl_Position = vec4(ndc, 0.0, 1.0);
    vQ = aPos; vA = (1.0 - alt);
    if (sy < uWaterY + 2.0) vA = 0.0;
  }`;
  const SHADOW_FS = `#version 300 es
  precision highp float;
  in vec2 vQ; in float vA; out vec4 outC;
  void main(){
    float d = length(vQ - 0.5);
    float a = smoothstep(0.5, 0.12, d) * vA * vA * 0.34;
    outC = vec4(vec3(0.01, 0.02, 0.05), a);
  }`;

  // ---------- Water sim (wave equation, ping-pong) ----------
  const SIM_FS = `#version 300 es
  precision highp float;
  in vec2 vUV; out vec4 outC;
  uniform sampler2D uPrev; uniform vec2 uSimRes;
  uniform vec4 uDrops[8];   // x, y (uv), radius, strength
  void main(){
    ivec2 ij = ivec2(gl_FragCoord.xy);
    ivec2 mx = ivec2(uSimRes) - 1;
    vec2 c = texelFetch(uPrev, ij, 0).rg;             // r = h, g = h_prev
    float l = texelFetch(uPrev, clamp(ij+ivec2(-1,0), ivec2(0), mx), 0).r;
    float r = texelFetch(uPrev, clamp(ij+ivec2( 1,0), ivec2(0), mx), 0).r;
    float u = texelFetch(uPrev, clamp(ij+ivec2(0,-1), ivec2(0), mx), 0).r;
    float d = texelFetch(uPrev, clamp(ij+ivec2(0, 1), ivec2(0), mx), 0).r;
    float lap = l + r + u + d - 4.0*c.r;
    float vel = (c.r - c.g) * 0.996 + lap * 0.44;
    float hn = c.r + vel;
    vec2 uv = gl_FragCoord.xy / uSimRes;
    for (int i = 0; i < 8; i++) {
      if (uDrops[i].w != 0.0) {
        float dd = length((uv - uDrops[i].xy) * vec2(uSimRes.x/uSimRes.y, 1.0));
        hn += uDrops[i].w * exp(-dd*dd / (uDrops[i].z*uDrops[i].z));
      }
    }
    hn *= 0.9985;
    outC = vec4(hn, c.r, 0.0, 1.0);
  }`;

  // ---------- Water render (waves, Fresnel, reflections, glitter) ----------
  const WATER_FS = `#version 300 es
  precision highp float;
  in vec2 vUV; out vec4 outC;
  uniform vec2 uRes; uniform float uTime, uWaterY, uSquash, uHasSim;
  uniform sampler2D uSim, uRefl;
  uniform vec2 uSimRes;
  uniform vec3 uBodyCol; uniform vec4 uBody; uniform float uLightI;
  ${SKY_FN}
  void main(){
    float lake = uRes.y - uWaterY;
    float t = vUV.y;                                  // 0 horizon .. 1 near
    float xPix = vUV.x * uRes.x;
    float yPix = uWaterY + t * lake;
    // --- wave field: sim + procedural wind waves (foreshortened) ---
    float persp = mix(3.2, 1.0, t);
    vec2 su = vec2(vUV.x, t);
    float hx = 0.0, hy = 0.0, hC = 0.0;
    if (uHasSim > 0.5) {
      vec2 e = 1.0 / uSimRes;
      hC = texture(uSim, su).r;
      hx = texture(uSim, su + vec2(e.x,0)).r - texture(uSim, su - vec2(e.x,0)).r;
      hy = texture(uSim, su + vec2(0,e.y)).r - texture(uSim, su - vec2(0,e.y)).r;
    }
    float k1 = 90.0*persp, k2 = 41.0*persp, k3 = 150.0*persp;
    float px1 = cos(vUV.x*k1 + uTime*1.5 + t*8.0)  * 0.018;
    float px2 = cos(vUV.x*k2 - uTime*0.9 + t*24.0) * 0.030;
    float py1 = cos(t*60.0 + uTime*1.1 + vUV.x*30.0) * 0.020;
    float px3 = cos(vUV.x*k3 + uTime*2.3) * 0.008;
    float nx = hx*2.2 + px1 + px2 + px3;
    float ny = hy*2.2 + py1;
    vec3 n = normalize(vec3(-nx*2.4, 1.0, -ny*2.4)); // water-plane normal, y up
    // --- reflections ---
    float mirY = uWaterY - (yPix - uWaterY) / uSquash;
    float distAmp = (14.0 + 90.0*t);
    vec2 reflUV = vec2((xPix + nx*distAmp) / uRes.x, 1.0 - (yPix + ny*distAmp*0.6) / uRes.y);
    vec4 birds = texture(uRefl, reflUV);
    vec3 skyR = skyCol(clamp(mirY/uRes.y + ny*0.9, 0.0, 1.0));
    // reflected sun/moon
    if (uBody.w > -0.05) {
      float bMirY = uWaterY + (uWaterY - uBody.y) * uSquash;
      vec2 dv = vec2(xPix - uBody.x, yPix - bMirY);
      float halo = exp(-length(dv) / (min(uRes.x,uRes.y)*0.22)) * 0.26 * max(0.12, uBody.w);
      skyR += uBodyCol * halo;
    }
    vec3 refl = mix(skyR, birds.rgb, birds.a * 0.85);
    // --- composition: Fresnel toward horizon, deep water near viewer ---
    vec3 horizonC = skyCol(0.985);
    vec3 deep = mix(vec3(0.03, 0.05, 0.095) + horizonC*0.16, refl*0.38, 0.40);
    float fres = pow(1.0 - t, 1.1)*0.62 + 0.30;
    vec3 col = mix(deep, refl, fres);
    // wave shading (3D light on the surface)
    vec3 Lw = normalize(vec3((uBody.x/uRes.x - vUV.x)*0.8, max(uBody.w, 0.08)*1.4, 0.55));
    float diff = max(dot(n, Lw), 0.0);
    col *= 0.78 + 0.42*diff;
    // sun/moon glitter path from wave normals
    vec3 Vw = normalize(vec3(0.0, 0.62, 0.79));
    vec3 Hw = normalize(Lw + Vw);
    float spec = pow(max(dot(n, Hw), 0.0), 140.0) * uLightI * 2.2;
    float path = exp(-abs(xPix - uBody.x) / (uRes.x*(0.055 + 0.10*t)));
    col += uBodyCol * spec * (0.25 + 1.6*path) * step(-0.04, uBody.w);
    // sim swell brightening (crests catch light)
    col += uBodyCol * clamp(hC, 0.0, 1.0) * 0.10 * uLightI;
    // shoreline sheen
    col += horizonC * smoothstep(0.008, 0.0, t) * 0.22;
    outC = vec4(col, 1.0);
  }`;

  // water quad vertex: maps 0..1 into the lake strip
  const WATER_VS = `#version 300 es
  layout(location=0) in vec2 aPos;
  uniform vec2 uRes; uniform float uWaterY;
  out vec2 vUV;
  void main(){
    vUV = aPos;
    float yTopN = 1.0 - uWaterY/uRes.y*2.0;
    float y = mix(yTopN, -1.0, aPos.y);
    gl_Position = vec4(aPos.x*2.0-1.0, y, 0.0, 1.0);
  }`;

  const progSky = mkProg(QUAD_VS, SKY_FS);
  const progBird = mkProg(BIRD_VS, BIRD_FS);
  const progShadow = mkProg(SHADOW_VS, SHADOW_FS);
  const progSim = mkProg(QUAD_VS, SIM_FS);
  const progWater = mkProg(WATER_VS, WATER_FS);

  // ---------- Geometry ----------
  const quadBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);

      const buf = ac.createBuffer(1, ac.sampleRate*2, ac.sampleRate);

      const src = ac.createBufferSource(); src.buffer = buf; src.loop = true;
      const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 480;
      const windGain = ac.createGain(); windGain.gain.value = 0.35;

  }
  function bindBirdAttrs() {
    gl.bindBuffer(gl.ARRAY_BUFFER, meshBuf);
    gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 28, 0);  gl.vertexAttribDivisor(0, 0);
    gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 28, 12); gl.vertexAttribDivisor(1, 0);
    gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 1, gl.FLOAT, false, 28, 24); gl.vertexAttribDivisor(2, 0);
    gl.bindBuffer(gl.ARRAY_BUFFER, instBuf);
    gl.enableVertexAttribArray(3); gl.vertexAttribPointer(3, 4, gl.FLOAT, false, 28, 0);  gl.vertexAttribDivisor(3, 1);
    gl.enableVertexAttribArray(4); gl.vertexAttribPointer(4, 3, gl.FLOAT, false, 28, 16); gl.vertexAttribDivisor(4, 1);
  }
  function disableAttrs() { for (let i = 0; i < 5; i++) { gl.disableVertexAttribArray(i); gl.vertexAttribDivisor(i, 0); } }

  // ---------- Render ----------
  function celestial() {
    const c = ((cycleC%1)+1)%1;
    const sunAlt = Math.cos((c - 0.40)*Math.PI*2);
    const moonAlt = Math.cos((c - 0.90)*Math.PI*2);
    const isSun = sunAlt >= moonAlt;
    const alt = Math.max(sunAlt, moonAlt);
    let bx;
    if (isSun) { const prog=(c-0.15)/0.5; bx = (prog<0?prog+2:prog)*W; }
    else { const prog=((c-0.65+1)%1)/0.5; bx = prog*W; }
    const by = waterY - Math.max(0,alt)*(H*0.66);
    const br = Math.min(W,H)*0.045;
    const col = isSun ? [1.0,0.933,0.769] : [0.839,0.871,0.941];
    return { bx, by, br, alt, isSun, col };
  }

  function draw(t) {
    const ts = t * 0.001;
    computeSky(cycleC);
    const cel = celestial();
    const lightI = 0.55 + 0.65*Math.max(0, cel.alt);
    packInstances();

    // --- 1. water sim update ---
    if (hasSim && !reduced) {
      dropUniform.fill(0);
      for (let i = 0; i < drops.length; i++) {
        dropUniform[i*4] = drops[i][0]; dropUniform[i*4+1] = drops[i][1];
        dropUniform[i*4+2] = drops[i][2]; dropUniform[i*4+3] = drops[i][3];
      }
      drops.length = 0;
      gl.bindFramebuffer(gl.FRAMEBUFFER, simPing ? simFBB : simFBA);
      gl.viewport(0, 0, SIMW, SIMH);
      gl.disable(gl.DEPTH_TEST); gl.disable(gl.BLEND);
      gl.useProgram(progSim);
      bindQuad(0);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, simPing ? simTexA : simTexB);
      gl.uniform1i(U(progSim,"uPrev"), 0);
      gl.uniform2f(U(progSim,"uSimRes"), SIMW, SIMH);
      gl.uniform4fv(U(progSim,"uDrops"), dropUniform);
      gl.drawArrays(gl.TRIANGLES, 0, 6);
      simPing = !simPing;
    }

    // --- 2. reflection pass (mirrored birds into half-res FBO) ---
    gl.bindFramebuffer(gl.FRAMEBUFFER, reflFB);
    gl.viewport(0, 0, reflW, reflH);
    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.disable(gl.DEPTH_TEST);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.useProgram(progBird);
    bindBirdAttrs();
    gl.uniform2f(U(progBird,"uRes"), W, H);
    gl.uniform1f(U(progBird,"uReflect"), 1);
    gl.uniform1f(U(progBird,"uWaterY"), waterY);
    gl.uniform1f(U(progBird,"uSquash"), 0.30);
    gl.uniform3fv(U(progBird,"uStops"), stopsFlat);
    gl.uniform3f(U(progBird,"uLightPos"), cel.bx, cel.by, 640);
    gl.uniform3f(U(progBird,"uLightCol"), cel.col[0], cel.col[1], cel.col[2]);
    gl.uniform1f(U(progBird,"uLightI"), lightI);
    gl.drawArraysInstanced(gl.TRIANGLES, 0, birdVerts, N);

    // --- 3. main pass ---
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, W*DPR, H*DPR);
    gl.disable(gl.DEPTH_TEST); gl.disable(gl.BLEND);

    // sky
    gl.useProgram(progSky);
    disableAttrs(); bindQuad(0);
    gl.uniform2f(U(progSky,"uRes"), W, H);
    gl.uniform1f(U(progSky,"uTime"), ts);
    gl.uniform1f(U(progSky,"uStar"), curStar);
    gl.uniform1f(U(progSky,"uWaterY"), waterY);
    gl.uniform3fv(U(progSky,"uStops"), stopsFlat);
    gl.uniform4f(U(progSky,"uBody"), cel.bx, cel.by, cel.br, cel.alt);
    gl.uniform3f(U(progSky,"uBodyCol"), cel.col[0], cel.col[1], cel.col[2]);
    gl.uniform1f(U(progSky,"uIsSun"), cel.isSun ? 1 : 0);
    gl.drawArrays(gl.TRIANGLES, 0, 6);

    // water
    gl.useProgram(progWater);
    disableAttrs(); bindQuad(0);
    gl.uniform2f(U(progWater,"uRes"), W, H);
    gl.uniform1f(U(progWater,"uTime"), ts);
    gl.uniform1f(U(progWater,"uWaterY"), waterY);
    gl.uniform1f(U(progWater,"uSquash"), 0.30);
    gl.uniform1f(U(progWater,"uHasSim"), hasSim ? 1 : 0);
    gl.uniform3fv(U(progWater,"uStops"), stopsFlat);
    gl.uniform4f(U(progWater,"uBody"), cel.bx, cel.by, cel.br, cel.alt);
    gl.uniform3f(U(progWater,"uBodyCol"), cel.col[0], cel.col[1], cel.col[2]);
    gl.uniform1f(U(progWater,"uLightI"), lightI);
    gl.uniform2f(U(progWater,"uSimRes"), SIMW, SIMH);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, hasSim ? (simPing ? simTexA : simTexB) : blackTex);
    gl.uniform1i(U(progWater,"uSim"), 0);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, reflTex);
    gl.uniform1i(U(progWater,"uRefl"), 1);
    gl.drawArrays(gl.TRIANGLES, 0, 6);

    // bird shadows on the water
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.useProgram(progShadow);
    disableAttrs();
    bindQuad(0);
    gl.bindBuffer(gl.ARRAY_BUFFER, instBuf);
    gl.enableVertexAttribArray(3); gl.vertexAttribPointer(3, 4, gl.FLOAT, false, 28, 0);  gl.vertexAttribDivisor(3, 1);
    gl.enableVertexAttribArray(4); gl.vertexAttribPointer(4, 3, gl.FLOAT, false, 28, 16); gl.vertexAttribDivisor(4, 1);
    gl.uniform2f(U(progShadow,"uRes"), W, H);
    gl.uniform1f(U(progShadow,"uWaterY"), waterY);
    gl.uniform1f(U(progShadow,"uSquash"), 0.30);
    gl.uniform3f(U(progShadow,"uLightPos"), cel.bx, cel.by, 640);
    gl.drawArraysInstanced(gl.TRIANGLES, 0, 6, N);

    // birds
    gl.enable(gl.DEPTH_TEST);
    gl.depthFunc(gl.LEQUAL);
    gl.clear(gl.DEPTH_BUFFER_BIT);
    gl.useProgram(progBird);
    disableAttrs(); bindBirdAttrs();
    gl.uniform2f(U(progBird,"uRes"), W, H);
    gl.uniform1f(U(progBird,"uReflect"), 0);
    gl.uniform1f(U(progBird,"uWaterY"), waterY);
    gl.uniform1f(U(progBird,"uSquash"), 0.30);
    gl.uniform3fv(U(progBird,"uStops"), stopsFlat);
    gl.uniform3f(U(progBird,"uLightPos"), cel.bx, cel.by, 640);
    gl.uniform3f(U(progBird,"uLightCol"), cel.col[0], cel.col[1], cel.col[2]);
    gl.uniform1f(U(progBird,"uLightI"), lightI);
    gl.drawArraysInstanced(gl.TRIANGLES, 0, birdVerts, N);
    gl.disable(gl.DEPTH_TEST);

    // HUD
    const ph = phaseName(cycleC);
    if (ph !== lastPhase) { lastPhase = ph; hudEl.innerHTML = `<b>${ph}</b> &nbsp;·&nbsp; ${N.toLocaleString()} starlings`; }
  }

  let raf;
  function loop(t) { step(t || 0); draw(t || 0); raf = requestAnimationFrame(loop); }

  window.addEventListener("resize", () => { resize(); if (N === 0) initBoids(); });
  if (window.ResizeObserver) new ResizeObserver(() => { resize(); if (N === 0) initBoids(); }).observe(canvas);
  resize(); initBoids();

  // minimal debug hooks (used for automated visual testing)
  window.murmur = {
    tick(n) { const b = performance.now(); for (let k = 0; k < n; k++) step(b + k*16); draw(b + n*16); },
    gather, release,
    stats() { let mx=0,my=0; for(let i=0;i<N;i++){mx+=px[i];my+=py[i];}
      return { N, W, H, waterY, formMix: +formMix.toFixed(2), meanx: (mx/N)|0, meany: (my/N)|0, hasSim }; },
  };

  if (reduced) { computeSky(cycleC); draw(0); } else loop(0);
})();
</script>
</body>
</html>
