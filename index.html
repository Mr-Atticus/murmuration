<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Murmuration</title>
<style>
  :root { --ink: #f2ebdd; --ink-dim: rgba(242, 235, 221, 0.5); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #0b0e1c; }
  #sky { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }

  .overlay {
    position: fixed; z-index: 2; color: var(--ink);
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
    user-select: none; pointer-events: none;
    transition: opacity 1.8s ease;
    text-shadow: 0 1px 22px rgba(0,0,0,0.55);
  }
  .title { left: clamp(20px, 4vw, 56px); bottom: clamp(20px, 4vh, 48px); }
  .title h1 {
    font-family: ui-serif, Georgia, "Times New Roman", serif;
    font-weight: 300; font-size: clamp(1.9rem, 5.2vw, 3.6rem);
    letter-spacing: 0.12em; line-height: 1;
  }
  .title p {
    margin-top: 0.7em; font-size: 0.72rem; letter-spacing: 0.3em;
    text-transform: uppercase; color: var(--ink-dim);
  }
  .hint {
    right: clamp(20px, 4vw, 56px); bottom: clamp(20px, 4vh, 48px);
    text-align: right; font-size: 0.72rem; letter-spacing: 0.13em;
    color: var(--ink-dim); line-height: 2.05;
  }
  .hint b { color: var(--ink); font-weight: 500; }
  .hint kbd {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 0.68rem; color: var(--ink);
    border: 1px solid rgba(242,235,221,0.3); border-radius: 4px;
    padding: 1px 5px; letter-spacing: 0;
  }
  .hud {
    left: 50%; top: clamp(16px, 3.4vh, 36px); transform: translateX(-50%);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 0.66rem; letter-spacing: 0.32em; color: var(--ink-dim);
    text-transform: uppercase; white-space: nowrap;
  }
  .hud b { color: var(--ink); font-weight: 400; }
  .sound {
    position: fixed; z-index: 3; top: clamp(14px, 3vh, 32px); right: clamp(18px, 4vw, 52px);
    pointer-events: auto; cursor: pointer;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 0.64rem; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--ink-dim); background: rgba(20,22,40,0.28);
    border: 1px solid rgba(242,235,221,0.22); border-radius: 999px;
    padding: 6px 13px; backdrop-filter: blur(6px);
    transition: color .3s ease, border-color .3s ease, background .3s ease;
    text-shadow: 0 1px 14px rgba(0,0,0,0.5);
  }
  .sound:hover { color: var(--ink); border-color: rgba(242,235,221,0.5); }
  .sound.on { color: var(--ink); border-color: rgba(242,235,221,0.55); background: rgba(40,44,70,0.4); }
  .sound:focus-visible { outline: 2px solid rgba(242,235,221,0.7); outline-offset: 3px; }
  .faded { opacity: 0; }
  .nogl {
    position: fixed; inset: 0; z-index: 5; display: none;
    align-items: center; justify-content: center; text-align: center;
    color: var(--ink); font-family: ui-sans-serif, sans-serif; padding: 2rem;
  }
  @media (prefers-reduced-motion: reduce) { .overlay { transition: none; } }
  @media (max-width: 640px) { .hint { display: none; } }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<button class="sound" id="soundBtn" aria-pressed="false">♪ sound off</button>
<div class="overlay hud" id="hudEl"></div>
<div class="overlay title" id="titleEl">
  <h1>Murmuration</h1>
  <p>a living sky</p>
</div>
<div class="overlay hint" id="hintEl">
  move &mdash; the flock reads you as a <b>falcon</b><br>
  drag the water &mdash; make waves<br>
  click &mdash; scatter the sky<br>
  <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> <kbd>4</kbd> &mdash; gather into a shape<br>
  <kbd>space</kbd> &mdash; release the flock
</div>
<div class="nogl" id="noglEl"><p>This piece needs WebGL2.<br>Please try a current browser.</p></div>

<script>
(() => {
  "use strict";
  const canvas = document.getElementById("sky");
  const gl = canvas.getContext("webgl2", { alpha: false, antialias: true });
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!gl) { document.getElementById("noglEl").style.display = "flex"; return; }
  const floatExt = gl.getExtension("EXT_color_buffer_float") || gl.getExtension("EXT_color_buffer_half_float");

  let W = 0, H = 0, DPR = 1;

  // ============ World ============
  // Right-handed-ish: x right, y up, z into the scene. Lake = plane y 0.
  const FOV = 55 * Math.PI / 180;
  const EYE_H = 13.5;
  const SIM_X0 = -260, SIM_XW = 520, SIM_Z0 = 0, SIM_ZW = 520;   // wave-sim coverage, world units

  // ============ Day/night palette ============
  const K = {
    NIGHT:    { c: [[8,10,24],[12,14,32],[20,20,44],[30,26,54],[44,34,60],[60,44,66]], s: 1.0 },
    DAWN:     { c: [[26,30,66],[70,58,104],[150,96,120],[224,140,130],[244,180,150],[252,214,180]], s: 0.28 },
    DAY:      { c: [[40,92,172],[74,132,206],[120,170,224],[176,206,236],[212,230,244],[236,244,250]], s: 0.0 },
    GOLDEN:   { c: [[38,44,92],[92,80,120],[190,120,96],[236,158,92],[248,192,120],[252,222,164]], s: 0.05 },
    DUSK:     { c: [[16,20,40],[34,32,62],[110,72,84],[176,96,74],[222,140,84],[248,206,150]], s: 0.22 },
    TWILIGHT: { c: [[10,12,30],[22,22,48],[52,40,72],[96,58,78],[140,80,84],[180,110,96]], s: 0.7 },
  };
  const SCHED = [ [0.00,"NIGHT"], [0.15,"DAWN"], [0.32,"DAY"], [0.55,"GOLDEN"], [0.70,"DUSK"], [0.85,"TWILIGHT"], [1.00,"NIGHT"] ];
  const stopsFlat = new Float32Array(18);
  let curStar = 0;
  function computeSky(c) {
    c = ((c % 1) + 1) % 1;
    let a = SCHED[0], b = SCHED[1];
    for (let i = 1; i < SCHED.length; i++) { if (c <= SCHED[i][0]) { a = SCHED[i-1]; b = SCHED[i]; break; } }
    const f = (c - a[0]) / (b[0] - a[0]);
    const A = K[a[1]], B = K[b[1]];
    for (let i = 0; i < 6; i++) for (let k = 0; k < 3; k++)
      stopsFlat[i*3+k] = A.c[i][k] + (B.c[i][k] - A.c[i][k]) * f;
    curStar = A.s + (B.s - A.s) * f;
  }

  // ============ Minimal mat4 (column-major) ============
  function mPersp(fovy, aspect, near, far) {
    const f = 1 / Math.tan(fovy / 2), nf = 1 / (near - far);
    return new Float32Array([f/aspect,0,0,0, 0,f,0,0, 0,0,(far+near)*nf,-1, 0,0,2*far*near*nf,0]);
  }
  function mLookAt(e, c, up) {
    let zx=e[0]-c[0], zy=e[1]-c[1], zz=e[2]-c[2];
    let zl=Math.hypot(zx,zy,zz); zx/=zl; zy/=zl; zz/=zl;
    let xx=up[1]*zz-up[2]*zy, xy=up[2]*zx-up[0]*zz, xz=up[0]*zy-up[1]*zx;
    let xl=Math.hypot(xx,xy,xz); xx/=xl; xy/=xl; xz/=xl;
    const yx=zy*xz-zz*xy, yy=zz*xx-zx*xz, yz=zx*xy-zy*xx;
    return new Float32Array([
      xx,yx,zx,0, xy,yy,zy,0, xz,yz,zz,0,
      -(xx*e[0]+xy*e[1]+xz*e[2]), -(yx*e[0]+yy*e[1]+yz*e[2]), -(zx*e[0]+zy*e[1]+zz*e[2]), 1]);
  }
  function mMul(a, b) {
    const o = new Float32Array(16);
    for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) {
      o[c*4+r] = a[r]*b[c*4] + a[4+r]*b[c*4+1] + a[8+r]*b[c*4+2] + a[12+r]*b[c*4+3];
    }
    return o;
  }

  // ============ GL helpers ============
  function mkShader(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
      console.error("shader error:", gl.getShaderInfoLog(s));
    return s;
  }
  function mkProg(vs, fs) {
    const p = gl.createProgram();
    gl.attachShader(p, mkShader(gl.VERTEX_SHADER, vs));
    gl.attachShader(p, mkShader(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) console.error("link error:", gl.getProgramInfoLog(p));
    return p;
  }
  const U = (p, n) => gl.getUniformLocation(p, n);

  // ============ Shared GLSL: sky gradient + mountains + celestial bodies ============
  // All direction-based, so the water can evaluate the same world along reflected rays.
  const WORLD_FN = `
  uniform vec3 uStops[6];
  uniform vec3 uSunDir, uMoonDir, uSunCol, uMoonCol;
  uniform float uSunVis, uMoonVis, uStar, uTime;
  const float SPP[6] = float[6](0.0,0.40,0.62,0.80,0.92,1.0);
  vec3 gradCol(float t){
    t = clamp(t, 0.0, 1.0);
    vec3 c = uStops[5];
    for (int i = 1; i < 6; i++) {
      if (t <= SPP[i]) { c = mix(uStops[i-1], uStops[i], (t-SPP[i-1])/(SPP[i]-SPP[i-1])); break; }
    }
    return c / 255.0;
  }
  float hash11(float p){ p = fract(p*443.8975); p += dot(vec2(p,p), vec2(p+19.19, p+7.13)); return fract(p*p); }
  float hash21(vec2 p){ p = fract(p*vec2(123.34,456.21)); p += dot(p, p+45.32); return fract(p.x*p.y); }
  float vnoise(float x){
    float i = floor(x), f = fract(x);
    float u = f*f*(3.0-2.0*f);
    return mix(hash11(i), hash11(i+1.0), u);
  }
  float vnoise2(vec2 p){
    vec2 i = floor(p), f = fract(p);
    vec2 u = f*f*(3.0-2.0*f);
    return mix(mix(hash21(i), hash21(i+vec2(1,0)), u.x),
               mix(hash21(i+vec2(0,1)), hash21(i+vec2(1,1)), u.x), u.y);
  }
  float fbm2(vec2 p){
    float a = 0.0, w = 0.5;
    for (int i = 0; i < 4; i++) { a += vnoise2(p)*w; p *= 2.03; w *= 0.5; }
    return a;
  }
  float ridge(float x, float seed){
    float a = 0.0, amp = 0.55, fr = 1.0;
    for (int i = 0; i < 5; i++) {
      a += (1.0 - abs(vnoise(x*fr + seed)*2.0 - 1.0)) * amp;
      amp *= 0.45; fr *= 2.13;
    }
    return a;   // ~0..1.1
  }
  vec3 skyBase(vec3 d){
    float el = asin(clamp(d.y, -1.0, 1.0));
    float t = exp(-max(el, 0.0) * 2.6);
    vec3 col = gradCol(t);
    // stars
    if (uStar > 0.01 && el > 0.02) {
      vec2 sc = vec2(atan(d.x, d.z), el) * 60.0;
      vec2 cell = floor(sc);
      float h = hash21(cell);
      if (h > 0.88) {
        vec2 sp = vec2(hash21(cell+7.1), hash21(cell+3.7)) + cell;
        float dd = length(sc - sp - 0.5);
        float tw = 0.6 + 0.4*sin(uTime*(1.0+h*2.0)*2.0 + h*40.0);
        col += vec3(1.0,0.98,0.93) * smoothstep(0.10, 0.01, dd) * uStar * tw * (0.3+0.7*h) * smoothstep(0.02,0.25,el);
      }
    }
    // sun
    float cs = dot(d, uSunDir);
    col += uSunCol * (pow(max(cs,0.0), 220.0)*0.9 + pow(max(cs,0.0), 7.0)*0.16) * uSunVis;
    col = mix(col, uSunCol*1.15, smoothstep(0.99965, 0.99985, cs) * uSunVis);
    // moon with crescent
    float cm = dot(d, uMoonDir);
    col += uMoonCol * pow(max(cm,0.0), 320.0) * 0.5 * uMoonVis;
    float mdisc = smoothstep(0.99955, 0.99975, cm);
    if (mdisc > 0.0) {
      vec3 mp = normalize(cross(uMoonDir, vec3(0.0,1.0,0.0)));
      vec3 d2 = normalize(uMoonDir + mp*0.014 + vec3(0.0,0.009,0.0));
      float sh = smoothstep(0.99958, 0.99978, dot(d, d2));
      vec3 mcol = mix(uMoonCol, gradCol(exp(-max(el,0.0)*2.6))*1.05, sh*0.88);
      col = mix(col, mcol, mdisc * uMoonVis);
    }
    return col;
  }
  float ridgeH(float az, float sc, float seed, float hgt){
    float r = ridge(az*sc + seed*3.1, seed);
    float spike = pow(ridge(az*sc*3.3 + seed*1.7, seed+9.0), 3.2);
    return (pow(r, 1.8)*0.72 + spike*0.42) * hgt - 0.004;
  }
  // mountains: layered ridgelines shaded by their own slope; rgb + coverage in .a
  vec4 mountains(vec3 d){
    float el = asin(clamp(d.y, -1.0, 1.0));
    float az = atan(d.x, d.z);
    vec3 horizonC = gradCol(0.97);
    float dayL = clamp(dot(gradCol(0.45), vec3(0.333)), 0.0, 1.0);
    float sunAz = atan(uSunDir.x, uSunDir.z);
    float sdir = clamp((sunAz - az) * 2.2, -1.0, 1.0);      // is the sun left or right of this column
    vec3 skyAmb = mix(gradCol(0.72), gradCol(0.42), 0.45) * (0.30 + dayL*0.55);
    // layer params: scale, seed, height, haze
    for (int i = 0; i < 3; i++) {
      float sc   = i==0 ? 1.5 : (i==1 ? 2.6 : 4.1);
      float seed = i==0 ? 17.7 : (i==1 ? 4.2 : 31.9);
      float hgt  = i==0 ? 0.34 : (i==1 ? 0.20 : 0.085);
      float haze = i==0 ? 0.55 : (i==1 ? 0.32 : 0.13);
      float sil = ridgeH(az, sc, seed, hgt);
      if (el < sil) {
        float depth = clamp((sil - el)/max(hgt,1e-3), 0.0, 1.0);       // 0 ridge .. 1 base
        // slope of the ridgeline -> horizontal surface normal -> real form shading
        float e = 0.0045;
        float slope = (ridgeH(az+e, sc, seed, hgt) - ridgeH(az-e, sc, seed, hgt)) / (2.0*e);
        float sn = clamp(slope / (hgt*5.0 + 1e-4), -1.0, 1.0);
        // relief normal from 2D fbm across the face -> real crinkled rock, no vertical banding
        vec2 fp = vec2(az*sc*15.0, depth*5.5) + seed*3.0;
        float h0 = fbm2(fp);
        float dhx = fbm2(fp + vec2(0.10, 0.0)) - h0;
        float dhy = fbm2(fp + vec2(0.0, 0.10)) - h0;
        vec3 fn = normalize(vec3(-dhx*16.0, -dhy*16.0, 1.0));
        vec3 Ll = normalize(vec3(sdir*1.3, 0.5, 0.72));
        float lit = clamp(dot(fn, Ll), 0.0, 1.0)*0.72
                  + clamp(0.40 + 0.50*(-sn)*sdir, 0.0, 1.0)*0.42;
        lit *= mix(0.45, 1.0, 1.0 - depth*0.85);                       // valleys sit in shadow
        float grain = fbm2(vec2(az*sc*95.0, depth*40.0) + seed*3.0);
        vec3 rock = mix(vec3(0.085,0.085,0.105), vec3(0.21,0.20,0.215), grain);
        vec3 sunL = uSunCol * uSunVis * lit + uMoonCol * uMoonVis * lit * 0.22;
        vec3 mcol = rock * (skyAmb + sunL * 1.15);
        // snow: high ground, broken snowline, gathering in the relief hollows
        float snowN = fbm2(vec2(az*sc*11.0, depth*9.0) + seed*11.0);
        float snowT = smoothstep(hgt*0.34, hgt*0.66, el + (snowN-0.5)*hgt*0.42);
        snowT *= smoothstep(1.25, 0.55, abs(sn)) * (i==2 ? 0.0 : 1.0);
        vec3 snowCol = vec3(0.90,0.92,0.98) * (skyAmb*1.35 + sunL*1.30);
        mcol = mix(mcol, snowCol, clamp(snowT, 0.0, 1.0));
        // low-sun rim light catching the ridge crest
        float rim = smoothstep(0.055, 0.0, depth) * max(sdir*sign(-sn), 0.0) * uSunVis * (1.0 - dayL*0.55);
        mcol += uSunCol * rim * 0.45;
        mcol = mix(mcol, horizonC, haze * (0.45 + 0.55*depth) * (0.4 + 0.6*dayL));
        return vec4(mcol, 1.0);
      }
    }
    return vec4(0.0);
  }
  vec3 skyWorld(vec3 d){
    vec4 m = mountains(d);
    if (m.a > 0.5) return m.rgb;
    return skyBase(d);
  }
  `;

  const QUAD_VS = `#version 300 es
  layout(location=0) in vec2 aPos;
  out vec2 vUV;
  void main(){ vUV = aPos; gl_Position = vec4(aPos*2.0-1.0, 0.0, 1.0); }`;

  // ---------- Sky + mountains pass ----------
  const SKY_FS = `#version 300 es
  precision highp float;
  in vec2 vUV; out vec4 outC;
  uniform vec3 uEye, uFwd, uRight, uUp;
  uniform float uTanF, uAspect;
  ${WORLD_FN}
  void main(){
    vec2 ndc = vUV*2.0 - 1.0;
    vec3 d = normalize(uFwd + uTanF*(ndc.x*uAspect*uRight + ndc.y*uUp));
    outC = vec4(skyWorld(d), 1.0);
  }`;

  // ---------- Birds ----------
  const BIRD_VS = `#version 300 es
  layout(location=0) in vec3 aPos;
  layout(location=1) in vec3 aNorm;
  layout(location=2) in float aWing;
  layout(location=3) in vec4 aI0;   // world x,y,z, yaw
  layout(location=4) in vec4 aI1;   // pitch, bank, flapPhase, size
  uniform mat4 uVP;
  out vec3 vN; out vec3 vW;
  void main(){
    float flapA = sin(aI1.z) * 0.9;
    vec3 p = aPos, n = aNorm;
    float a = flapA * aWing;
    float ca = cos(a), sa = sin(a);
    p.yz = mat2(ca,-sa,sa,ca) * p.yz;  n.yz = mat2(ca,-sa,sa,ca) * n.yz;
    float b = aI1.y;
    float cb = cos(b), sb = sin(b);
    p.yz = mat2(cb,-sb,sb,cb) * p.yz;  n.yz = mat2(cb,-sb,sb,cb) * n.yz;
    // local (x fwd, y lateral, z up) -> world via flight basis
    float cy = cos(aI0.w), sy = sin(aI0.w), cp = cos(aI1.x), sp = sin(aI1.x);
    vec3 f = vec3(cy*cp, sp, sy*cp);
    vec3 r = normalize(cross(f, vec3(0.0,1.0,0.0)));
    vec3 u = cross(r, f);
    vec3 wp = aI0.xyz + (f*p.x + r*p.y + u*p.z) * aI1.w;
    vN = f*n.x + r*n.y + u*n.z;
    vW = wp;
    gl_Position = uVP * vec4(wp, 1.0);
  }`;

  const BIRD_FS = `#version 300 es
  precision highp float;
  in vec3 vN; in vec3 vW; out vec4 outC;
  uniform vec3 uEye;
  uniform float uReflMode;
  ${WORLD_FN}
  void main(){
    vec3 n = normalize(vN);
    if (!gl_FrontFacing) n = -n;
    vec3 V = normalize(uEye - vW);
    vec3 L = uSunVis >= uMoonVis ? uSunDir : uMoonDir;
    vec3 lc = uSunVis >= uMoonVis ? uSunCol : uMoonCol*0.5;
    float li = max(uSunVis, uMoonVis*0.55);
    vec3 Hv = normalize(L + V);
    // adaptive plumage vs sky behind
    vec3 behind = gradCol(exp(-max(asin(clamp(normalize(vW-uEye).y,-1.0,1.0)),0.0)*2.6));
    float lum = dot(behind, vec3(0.2126,0.7152,0.0722));
    float tt = smoothstep(0.06, 0.34, lum);
    vec3 alb = mix(vec3(0.95,0.92,0.86), vec3(0.09,0.08,0.12), tt);
    float diff = max(dot(n, L), 0.0);
    float spec = pow(max(dot(n, Hv), 0.0), 46.0) * 1.1;
    vec3 irid = mix(vec3(0.55,0.95,0.80), vec3(0.90,0.65,1.05), clamp(0.5+0.7*n.x, 0.0, 1.0));
    vec3 amb = mix(behind, vec3(0.5+lum), 0.55) * 0.85 + 0.10;
    vec3 col = alb * (amb + lc * diff * li * 0.85) + irid * spec * li;
    // aerial perspective
    float dist = length(vW - uEye);
    col = mix(col, behind, clamp(dist/900.0, 0.0, 0.72));
    float alpha = 1.0;
    if (uReflMode > 0.5) { col *= vec3(0.52,0.60,0.74); alpha = 0.6; }
    outC = vec4(col, alpha);
  }`;

  // ---------- Bird shadows, projected along light onto the lake ----------
  const SHADOW_VS = `#version 300 es
  layout(location=0) in vec2 aPos;      // unit quad
  layout(location=3) in vec4 aI0;
  layout(location=4) in vec4 aI1;
  uniform mat4 uVP;
  uniform vec3 uLightDir;               // points UP toward the light
  out vec2 vQ; out float vA;
  void main(){
    vec3 P = aI0.xyz;
    float ly = max(uLightDir.y, 0.25);
    vec3 sp = vec3(P.x - uLightDir.x*(P.y/ly), 0.06, P.z - uLightDir.z*(P.y/ly));
    vec3 a1 = normalize(vec3(uLightDir.x, 0.0, uLightDir.z) + vec3(0.001,0.0,0.0));
    vec3 a2 = vec3(-a1.z, 0.0, a1.x);
    float stretch = 1.0 + (1.0 - ly) * 1.6;
    float s = aI1.w * 3.4;
    vec3 wp = sp + a1*(aPos.x-0.5)*s*stretch + a2*(aPos.y-0.5)*s*1.1;
    gl_Position = uVP * vec4(wp, 1.0);
    vQ = aPos;
    vA = clamp(1.0 - P.y/45.0, 0.0, 1.0);
  }`;
  const SHADOW_FS = `#version 300 es
  precision highp float;
  in vec2 vQ; in float vA; out vec4 outC;

    audio && audio.whoosh();
  });
  window.addEventListener("keydown", e => {
    if (e.code === "Space") { e.preventDefault(); release(); }
    else if (e.key === "1") gather("heart");
    else if (e.key === "2") gather("star");
    else if (e.key === "3") gather("spiral");
    else if (e.key === "4") gather("text");
  });

  // ============ Overlays ============
  const titleEl = document.getElementById("titleEl"), hintEl = document.getElementById("hintEl"),
        hudEl = document.getElementById("hudEl");
  let faded = false;
  function fade() { if (faded) return; faded = true;
    setTimeout(() => { titleEl.classList.add("faded"); hintEl.classList.add("faded"); }, 4200); }
  setTimeout(fade, 8500);
  let lastPhase = "";
  function phaseName(c) {
    c = ((c%1)+1)%1;
    if (c < 0.10 || c >= 0.93) return "night";
    if (c < 0.22) return "dawn";
    if (c < 0.50) return "day";
    if (c < 0.66) return "golden hour";
    if (c < 0.80) return "dusk";
    return "twilight";
  }

  // ============ Ambient audio (opt-in) ============
  let audio = null;
  function buildAudio() {
    try {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
      const ac = new AC();
      const master = ac.createGain(); master.gain.value = 0.0; master.connect(ac.destination);
      const buf = ac.createBuffer(1, ac.sampleRate*2, ac.sampleRate);
      const d = buf.getChannelData(0); let last = 0;
      for (let i = 0; i < d.length; i++) { const wn = Math.random()*2-1; last = (last + 0.02*wn)/1.02; d[i] = last*3.2; }
      const src = ac.createBufferSource(); src.buffer = buf; src.loop = true;
      const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 480;
      const windGain = ac.createGain(); windGain.gain.value = 0.35;
      src.connect(lp); lp.connect(windGain); windGain.connect(master); src.start();
      let lfo = 0;
      const tick = () => { lfo += 0.006; windGain.gain.value = 0.22 + 0.16*Math.sin(lfo); if (audio && audio.on) requestAnimationFrame(tick); };
      const call = (freq, when, dur, vol) => {
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = "sine"; o.frequency.setValueAtTime(freq, when);
        o.frequency.linearRampToValueAtTime(freq*1.04, when+dur*0.5);
        g.gain.setValueAtTime(0, when); g.gain.linearRampToValueAtTime(vol, when+0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, when+dur);
        o.connect(g); g.connect(master); o.start(when); o.stop(when+dur+0.05);
      };
      let nextCall = 0;
      const scale = [523.25, 587.33, 698.46, 783.99, 880.0, 1046.5];
      const sched = () => {
        if (!audio || !audio.on) return;
        const now = ac.currentTime;
        if (now > nextCall) { const f = scale[(Math.random()*scale.length)|0]*(Math.random()<0.3?0.5:1);
          call(f, now+0.02, 0.5+Math.random()*0.7, 0.05+Math.random()*0.05); nextCall = now + 1.2 + Math.random()*3.2; }
        setTimeout(sched, 200);
      };
      return {
        on: false, ac, master,
        enable() { this.on = true; ac.resume(); master.gain.cancelScheduledValues(ac.currentTime);
          master.gain.setValueAtTime(master.gain.value, ac.currentTime); master.gain.linearRampToValueAtTime(0.9, ac.currentTime+1.2);
          tick(); sched(); },
        disable() { this.on = false; master.gain.linearRampToValueAtTime(0.0, ac.currentTime+0.6); },
        swell() { if (this.on) { windGain.gain.setValueAtTime(windGain.gain.value, ac.currentTime); windGain.gain.linearRampToValueAtTime(0.5, ac.currentTime+0.3); } },
        whoosh() { if (!this.on) return; const now = ac.currentTime;
          for (let i=0;i<5;i++) call(scale[(Math.random()*scale.length)|0], now+i*0.03, 0.3, 0.04); },
      };
    } catch (e) { return null; }
  }
  const soundBtn = document.getElementById("soundBtn");
  soundBtn.addEventListener("click", () => {
    if (!audio) audio = buildAudio();
    if (!audio) { soundBtn.textContent = "♪ n/a"; return; }
    if (audio.on) { audio.disable(); soundBtn.textContent = "♪ sound off"; soundBtn.classList.remove("on"); soundBtn.setAttribute("aria-pressed","false"); }
    else { audio.enable(); soundBtn.textContent = "♪ sound on"; soundBtn.classList.add("on"); soundBtn.setAttribute("aria-pressed","true"); }
  });

  // ============ Simulation ============
  const PERC = 7, PERC2 = PERC*PERC, SEP2 = 2.2*2.2;
  const MAXV = 0.30, MINV = 0.14;
  const CYCLE = 84000;
  let cycleC = 0.62, cycleBase = 0.62, startT = 0, lastAmbient = 0, roostY = 26;

  let frozen = false;
  function step(t) {
    if (!startT) startT = t;
    cycleC = frozen ? cycleBase : cycleBase + (t - startT) / CYCLE;
    rebuildGrid();
    roostY = 24 + 10*Math.sin(t*0.00006);
    const roostX = Math.sin(t*0.00004)*50, roostZ = 165 + Math.sin(t*0.000052)*55;
    formMix += (formTarget - formMix) * 0.028;
    const forming = formMix > 0.004;
    if (t - lastAmbient > 2600) {
      lastAmbient = t;
      if (Math.random() < 0.7) addDropWorld(SIM_X0 + Math.random()*SIM_XW, SIM_Z0 + Math.random()*SIM_ZW, 0.008, 0.22);
    }
    // falcon ray
    let ray = null;
    if (mouse.active) ray = cursorRay(mouse.x, mouse.y);

    for (let i = 0; i < N; i++) {
      const x = px[i], y = py[i], z = pz[i];
      let ax=0, ay=0, az=0, cxs=0, cys=0, czs=0, sx=0, sy=0, sz=0, cnt=0;
      const c0 = cellOf(x,y,z);
      const bx = c0 % GX, byz = (c0/GX)|0, by = byz % GY, bz = (byz/GY)|0;
      for (let oz=-1; oz<=1; oz++) { const rz2=bz+oz; if (rz2<0||rz2>=GZ) continue;
        for (let oy=-1; oy<=1; oy++) { const ry2=by+oy; if (ry2<0||ry2>=GY) continue;
          for (let ox=-1; ox<=1; ox++) { const rx2=bx+ox; if (rx2<0||rx2>=GX) continue;
            let j = heads[(rz2*GY + ry2)*GX + rx2];
            while (j !== -1) { if (j !== i) {
              const dx=px[j]-x, dy=py[j]-y, dz=pz[j]-z, d2=dx*dx+dy*dy+dz*dz;
              if (d2 < PERC2) {
                ax+=vx[j]; ay+=vy[j]; az+=vz[j];
                cxs+=px[j]; cys+=py[j]; czs+=pz[j]; cnt++;
                if (d2 < SEP2 && d2 > 0.0001) { const inv=1/d2; sx-=dx*inv; sy-=dy*inv; sz-=dz*inv; }
              } }
              j = nxt[j]; } } } }

      let ffx=0, ffy=0, ffz=0;
      if (cnt>0) {
        ffx += (ax/cnt)*0.05; ffy += (ay/cnt)*0.05; ffz += (az/cnt)*0.05;
        ffx += ((cxs/cnt)-x)*0.0016; ffy += ((cys/cnt)-y)*0.0016; ffz += ((czs/cnt)-z)*0.0016;
      }
      ffx += sx*0.16; ffy += sy*0.16; ffz += sz*0.16;
      ffx += (roostX - x)*0.00028; ffy += (roostY - y)*0.0016; ffz += (roostZ - z)*0.00028;
      ffx += Math.sin((y*3.1 + t*0.00013)) * 0.003;

      let gfx=0, gfy=0, gfz=0, nearT = false;
      if (forming) {
        const dxT = tx[i]-x, dyT = ty[i]-y, dzT = SHAPE_Z-z;
        nearT = dxT*dxT + dyT*dyT + dzT*dzT < 50;
        gfx = dxT*0.030 + sx*0.018;
        gfy = dyT*0.030 + sy*0.018;
        gfz = dzT*0.030 + sz*0.018;
      }
      let fx = ffx + (gfx-ffx)*formMix;
      let fy = ffy + (gfy-ffy)*formMix;
      let fz = ffz + (gfz-ffz)*formMix;

      if (ray) {   // repel from cursor ray (the falcon dives along your line of sight)
        const wx2 = x-cam.eye[0], wy2 = y-cam.eye[1], wz2 = z-cam.eye[2];
        const tp = wx2*ray[0]+wy2*ray[1]+wz2*ray[2];
        if (tp > 0) {
          const qx = wx2-ray[0]*tp, qy = wy2-ray[1]*tp, qz = wz2-ray[2]*tp;
          const d2 = qx*qx+qy*qy+qz*qz, R = 26, R2 = R*R;
          if (d2 < R2 && d2 > 0.001) {
            const d = Math.sqrt(d2), f = (1-d/R);
            const push = f*f*0.34;
            fx += qx/d*push; fy += qy/d*push; fz += qz/d*push;
          }
        }
      }
      if (scatter > 0.01) {
        const dx=x-scatterPt[0], dy=y-scatterPt[1], dz=z-scatterPt[2];
        const d = Math.hypot(dx,dy,dz)+0.01, f = scatter*0.5*Math.exp(-d/60);
        fx += dx/d*f; fy += dy/d*f; fz += dz/d*f;
      }
      // soft bounds
      if (x < FLOCK.x0) fx += (FLOCK.x0-x)*0.002; else if (x > FLOCK.x1) fx -= (x-FLOCK.x1)*0.002;
      if (z < FLOCK.z0) fz += (FLOCK.z0-z)*0.002; else if (z > FLOCK.z1) fz -= (z-FLOCK.z1)*0.002;
      if (y < FLOCK.y0+2) fy += (FLOCK.y0+2-y)*0.01;
      if (y > FLOCK.y1) fy -= (y-FLOCK.y1)*0.004;

      vx[i]+=fx; vy[i]+=fy; vz[i]+=fz;
      const sp = Math.hypot(vx[i],vy[i],vz[i]);
      const maxv = forming ? (nearT ? 0.085 : MAXV*1.35) : MAXV;
      if (sp>maxv){ const k=maxv/sp; vx[i]*=k; vy[i]*=k; vz[i]*=k; }
      else if (sp<MINV && !forming){ const k=MINV/(sp||1); vx[i]*=k; vy[i]*=k; vz[i]*=k; }
      if (forming && nearT) { const dmp = 1-0.14*formMix; vx[i]*=dmp; vy[i]*=dmp; vz[i]*=dmp; }

      px[i]=x+vx[i]; py[i]=y+vy[i]; pz[i]=z+vz[i];
      if (py[i] < 1.2) py[i] = 1.2;

      // orientation
      const yaw = Math.atan2(vz[i], vx[i]);
      const pit = Math.asin(Math.max(-1, Math.min(1, vy[i]/(sp||1))));
      let dy2 = yaw - yaw0[i];
      if (dy2 > Math.PI) dy2 -= Math.PI*2; else if (dy2 < -Math.PI) dy2 += Math.PI*2;
      bank[i] += (Math.max(-1.1, Math.min(1.1, -dy2*10)) - bank[i]) * 0.13;
      yaw0[i] = yaw;
      pit0[i] += (pit - pit0[i]) * 0.2;
      flap[i] += 0.22 + sp*0.5 - formMix*0.1;
    }
    if (scatter>0) scatter *= 0.9;
  }

  function packInstances() {
    for (let i = 0; i < N; i++) {
      const o = i*8;
      instData[o] = px[i]; instData[o+1] = py[i]; instData[o+2] = pz[i]; instData[o+3] = yaw0[i];
      instData[o+4] = pit0[i]; instData[o+5] = bank[i]; instData[o+6] = flap[i];
      instData[o+7] = 0.30;
    }
    gl.bindBuffer(gl.ARRAY_BUFFER, instBuf);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, instData);
  }

  function bindQuad(loc) {
    gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    gl.vertexAttribDivisor(loc, 0);
  }
  function bindInst() {
    gl.bindBuffer(gl.ARRAY_BUFFER, instBuf);
    gl.enableVertexAttribArray(3); gl.vertexAttribPointer(3, 4, gl.FLOAT, false, 32, 0);  gl.vertexAttribDivisor(3, 1);
    gl.enableVertexAttribArray(4); gl.vertexAttribPointer(4, 4, gl.FLOAT, false, 32, 16); gl.vertexAttribDivisor(4, 1);
  }
  function bindBirdAttrs() {
    gl.bindBuffer(gl.ARRAY_BUFFER, meshBuf);
    gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 28, 0);  gl.vertexAttribDivisor(0, 0);
    gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 28, 12); gl.vertexAttribDivisor(1, 0);
    gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 1, gl.FLOAT, false, 28, 24); gl.vertexAttribDivisor(2, 0);
    bindInst();
  }
  function disableAttrs() { for (let i = 0; i < 5; i++) { gl.disableVertexAttribArray(i); gl.vertexAttribDivisor(i, 0); } }

  // ============ Celestial state ============
  function celestial() {
    const c = ((cycleC%1)+1)%1;
    const sunAlt = Math.cos((c - 0.40)*Math.PI*2);      // -1..1
    const moonAlt = Math.cos((c - 0.90)*Math.PI*2);
    const sunProg = ((c - 0.15 + 1) % 1) / 0.5;         // 0..1 across the day arc
    const moonProg = ((c - 0.65 + 1) % 1) / 0.5;
    function dirOf(alt, prog) {
      const az = (prog - 0.5) * 0.52;                   // gentle sweep, stays over the lake
      const el = Math.max(-0.25, alt) * 0.75;
      const ce = Math.cos(el);
      return [Math.sin(az)*ce, Math.sin(el), Math.cos(az)*ce];
    }
    return {
      sunDir: dirOf(sunAlt, sunProg), moonDir: dirOf(moonAlt, moonProg),
      sunVis: Math.max(0, Math.min(1, (sunAlt+0.12)*4)),
      moonVis: Math.max(0, Math.min(1, (moonAlt+0.12)*4)) * 0.9,
      sunCol: [1.0, 0.92, 0.72], moonCol: [0.83, 0.87, 0.95],
    };
  }

  function setWorldUniforms(p, cel, ts) {
    gl.uniform3fv(U(p,"uStops"), stopsFlat);
    gl.uniform3fv(U(p,"uSunDir"), cel.sunDir);
    gl.uniform3fv(U(p,"uMoonDir"), cel.moonDir);
    gl.uniform3f(U(p,"uSunCol"), cel.sunCol[0], cel.sunCol[1], cel.sunCol[2]);
    gl.uniform3f(U(p,"uMoonCol"), cel.moonCol[0], cel.moonCol[1], cel.moonCol[2]);
    gl.uniform1f(U(p,"uSunVis"), cel.sunVis);
    gl.uniform1f(U(p,"uMoonVis"), cel.moonVis);
    gl.uniform1f(U(p,"uStar"), curStar);
    gl.uniform1f(U(p,"uTime"), ts);
  }

  // ============ Render ============
  function draw(t) {
    const ts = t * 0.001;
    computeSky(cycleC);
    updateCamera(ts);
    const cel = celestial();
    packInstances();

    // 1. wave sim
    if (hasSim && !reduced) {
      dropUniform.fill(0);
      for (let i = 0; i < drops.length; i++) {
        dropUniform[i*4] = drops[i][0]; dropUniform[i*4+1] = drops[i][1];
        dropUniform[i*4+2] = drops[i][2]; dropUniform[i*4+3] = drops[i][3];
      }
      drops.length = 0;
      gl.bindFramebuffer(gl.FRAMEBUFFER, simPing ? simFBB : simFBA);
      gl.viewport(0, 0, SIMR, SIMR);
      gl.disable(gl.DEPTH_TEST); gl.disable(gl.BLEND);
      gl.useProgram(progSim);
      disableAttrs(); bindQuad(0);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, simPing ? simTexA : simTexB);
      gl.uniform1i(U(progSim,"uPrev"), 0);
      gl.uniform2f(U(progSim,"uSimRes"), SIMR, SIMR);
      gl.uniform4fv(U(progSim,"uDrops"), dropUniform);
      gl.drawArrays(gl.TRIANGLES, 0, 6);
      simPing = !simPing;
    }

    // 2. planar reflection: birds mirrored about y=0
    gl.bindFramebuffer(gl.FRAMEBUFFER, reflFB);
    gl.viewport(0, 0, reflW, reflH);
    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.disable(gl.DEPTH_TEST);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.useProgram(progBird);
    disableAttrs(); bindBirdAttrs();
    gl.uniformMatrix4fv(U(progBird,"uVP"), false, cam.vpr);
    gl.uniform3fv(U(progBird,"uEye"), cam.eye);
    gl.uniform1f(U(progBird,"uReflMode"), 1);
    setWorldUniforms(progBird, cel, ts);
    gl.drawArraysInstanced(gl.TRIANGLES, 0, birdVerts, N);

    // 3. main pass
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, W*DPR, H*DPR);
    gl.disable(gl.DEPTH_TEST); gl.disable(gl.BLEND);

    // sky + mountains
    gl.useProgram(progSky);
    disableAttrs(); bindQuad(0);
    gl.uniform3fv(U(progSky,"uEye"), cam.eye);
    gl.uniform3fv(U(progSky,"uFwd"), cam.fwd);
    gl.uniform3fv(U(progSky,"uRight"), cam.right);
    gl.uniform3fv(U(progSky,"uUp"), cam.upv);
    gl.uniform1f(U(progSky,"uTanF"), Math.tan(FOV/2));
    gl.uniform1f(U(progSky,"uAspect"), W/H);
    setWorldUniforms(progSky, cel, ts);
    gl.drawArrays(gl.TRIANGLES, 0, 6);

    // water plane
    gl.useProgram(progWater);
    disableAttrs(); bindQuad(0);
    gl.uniformMatrix4fv(U(progWater,"uVP"), false, cam.vp);
    gl.uniform3fv(U(progWater,"uEye"), cam.eye);
    gl.uniform2f(U(progWater,"uViewPx"), W*DPR, H*DPR);
    gl.uniform4f(U(progWater,"uSimRect"), SIM_X0, SIM_Z0, SIM_XW, SIM_ZW);
    gl.uniform1f(U(progWater,"uHasSim"), hasSim ? 1 : 0);
    setWorldUniforms(progWater, cel, ts);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, hasSim ? (simPing ? simTexA : simTexB) : blackTex);
    gl.uniform1i(U(progWater,"uSim"), 0);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, reflTex);
    gl.uniform1i(U(progWater,"uRefl"), 1);
    gl.drawArrays(gl.TRIANGLES, 0, 6);

    // shadows on the lake
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.useProgram(progShadow);
    disableAttrs(); bindQuad(0); bindInst();
    gl.uniformMatrix4fv(U(progShadow,"uVP"), false, cam.vp);
    const ld = cel.sunVis >= cel.moonVis ? cel.sunDir : cel.moonDir;
    gl.uniform3f(U(progShadow,"uLightDir"), ld[0], Math.max(ld[1], 0.25), ld[2]);
    gl.drawArraysInstanced(gl.TRIANGLES, 0, 6, N);

    // birds
    gl.enable(gl.DEPTH_TEST);
    gl.depthFunc(gl.LEQUAL);
    gl.clear(gl.DEPTH_BUFFER_BIT);
    gl.useProgram(progBird);
    disableAttrs(); bindBirdAttrs();
    gl.uniformMatrix4fv(U(progBird,"uVP"), false, cam.vp);
    gl.uniform3fv(U(progBird,"uEye"), cam.eye);
    gl.uniform1f(U(progBird,"uReflMode"), 0);
    setWorldUniforms(progBird, cel, ts);
    gl.drawArraysInstanced(gl.TRIANGLES, 0, birdVerts, N);
    gl.disable(gl.DEPTH_TEST);

    const ph = phaseName(cycleC);
    if (ph !== lastPhase) { lastPhase = ph; hudEl.innerHTML = `<b>${ph}</b> &nbsp;·&nbsp; ${N.toLocaleString()} starlings`; }
  }

  let raf;
  function loop(t) { step(t || 0); draw(t || 0); raf = requestAnimationFrame(loop); }

  window.addEventListener("resize", () => { resize(); if (N === 0) initBoids(); });
  if (window.ResizeObserver) new ResizeObserver(() => { resize(); if (N === 0) initBoids(); }).observe(canvas);
  resize(); initBoids();

  // minimal debug hooks (used for automated visual testing)
  window.murmur = {
    tick(n) { const b = performance.now(); for (let k = 0; k < n; k++) step(b + k*16); draw(b + n*16); },
    setCycle(c) { cycleBase = c; cycleC = c; startT = 0; frozen = true; draw(performance.now()); },
    unfreeze() { frozen = false; startT = 0; },
    gather, release,
    stats() { let mx=0,my=0,mz=0; for(let i=0;i<N;i++){mx+=px[i];my+=py[i];mz+=pz[i];}
      return { N, W, H, formMix: +formMix.toFixed(2), meanx: (mx/N)|0, meany: (my/N)|0, meanz: (mz/N)|0, hasSim }; },
  };

  if (reduced) { computeSky(cycleC); updateCamera(0); draw(0); } else loop(0);
})();
</script>
</body>
</html>
